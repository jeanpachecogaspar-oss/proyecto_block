### ⚠️ Reglas importantes para `project.yml`:
* **No uses la tecla TAB:** Los archivos `.yml` solo permiten sangría con **espacios** (presiona la barra espaciadora)[cite: 1].
* **Curso exacto:** El valor de `course` debe ser escrito tal cual: `"Pruebas y Calidad de Software"`[cite: 1].
* **Integrantes:** Si trabajas en grupo, agrega otro bloque `- name:` debajo del tuyo con los datos de tu compañero[cite: 1].

Una vez guardado `project.yml`, ya tendrás listos todos los archivos requeridos y podrás proceder a subir el proyecto con los comandos `git` a GitLab[cite: 1, 2].